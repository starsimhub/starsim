quartodoc:
  package: starsim
  title: API
  style: pkgdown
  dir: api
  parser: google
  parser_options: # Starsim documents parameters taken by **kwargs, and its Returns are prose with no type
    warn_unknown_params: false
    warn_missing_types: false
  render_interlinks: true
  sections:
    - contents: # No title/desc here: the page already shows an "API" heading from the top-level title above (issue #1330)
        - analyzers
        - connectors
        - data
        - demographics
        - diseases
        - distributions
        - geo
        - interventions
        - networks
        - people
        - products
        - results
        - run
        - settings
        - sim
        - strains
        - utils
    - title: Converters
      desc: Importing models from other frameworks, and exporting sims to them.
      contents:
        - kind: page
          path: converters
          package: starsim
          contents:
            - kind: auto
              name: converters
              include_imports: true
              children: embedded
    - title: Internals
      desc: How Starsim works under the hood, for developers rather than modelers.
      contents:
        - internals.arrays
        - internals.conditions
        - internals.dates
        - internals.debugtools
        - internals.dimensions
        - internals.display
        - internals.dists
        - internals.errors
        - internals.expressions
        - internals.fitting
        - internals.gradients
        - internals.graph
        - internals.loop
        - internals.modules
        - internals.parameters
        - internals.time
        - internals.timeline
        - internals.transitions
    - title: Library
      desc: |
        Example and reference modules that build on core Starsim but are not part of it.
        Import as `import starsim.library as ssl`. These modules are illustrative rather
        than validated; see the [user guide](../user_guide/library_diseases.qmd) for details.
      contents:
        # One page per library subpackage; contents are picked up automatically from each
        # subpackage's __init__.py, so adding a class to the library does not need any
        # docs changes. include_imports is required since these are imported, not defined,
        # in the __init__.py that is being documented. Keep package as starsim (not
        # starsim.library): otherwise quartodoc reparses all of starsim for every alias.
        - kind: page
          path: library.diseases
          package: starsim
          contents:
            - kind: auto
              name: library.diseases
              include_imports: true
              children: embedded
        - kind: page
          path: library.econ
          package: starsim
          contents:
            - kind: auto
              name: library.econ
              include_imports: true
              children: embedded
        - kind: page
          path: library.mnch
          package: starsim
          contents:
            - kind: auto
              name: library.mnch
              include_imports: true
              children: embedded
        - kind: page
          path: library.networks
          package: starsim
          contents:
            - kind: auto
              name: library.networks
              include_imports: true
              children: embedded

    - title: Solvers
      desc: The engines that run declared models, as compartments or as agents.
      contents:
        - solvers.agents
        - solvers.choose
        - solvers.compartmental
        - solvers.deliveries
        - solvers.engine
        - solvers.joint_states
        - solvers.mixing
        - solvers.particles
format:
  html:
    theme: 
      light: [cosmo, ./assets/styles-light.scss]
      dark: [cosmo, ./assets/styles-dark.scss]
    css: ./assets/styles.css
    grid:
      body-width: 1000px # Wider than Quarto's 800px, for code and figures; narrower screens collapse the sidebars first
    include-after-body: [./assets/collapse_sections.html, ./assets/tabset_fallback.html]
    toc: true
    toc-expand: true
    toc-depth: 5
    highlight-style: github

filters:
  - interlinks
  - assets/github_alerts.lua # GitHub alerts (> [!NOTE]) as callouts, for the README on the home page
  - authorship # Each page's authorship front matter as a badge (quartopydoc's extension, in _extensions/sciris)

interlinks:
  sources: {} # Only link to Starsim itself (objects.json); external inventories made every page slower to render
  autolink: true
  aliases:
    starsim: [null, ss]
    starsim.library: [ssl]

qpyd:
  variables: # For {{< var version >}}, read from the Starsim source
    version: {attr: __version__}
    versiondate: {attr: __versiondate__}
  prerender:
    commands: [python make_api.py] # The machine-readable API index (api.json, llms.txt, llms-full.txt)
    inputs: [make_api.py]
    outputs: [api.json, llms.txt, llms-full.txt]
  clean: # Temporary files the tutorials and user guide pages write
    - 'tutorials/**/my-*.*'
    - 'tutorials/**/example*.*'
    - 'user_guide/**/my-*.*'
    - 'user_guide/**/example*.*'
    - 'user_guide/results'

execute:
  freeze: auto # Only re-execute notebooks that have changed
  preload: [starsim] # With --jobs, import this once rather than for each notebook
  error: false # Do not continue if an error is encountered
  echo: true
  warning: true
