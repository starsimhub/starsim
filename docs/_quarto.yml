quartodoc:
  package: starsim
  title: API reference
  style: pkgdown
  dir: api
  parser: google
  render_interlinks: true
  sections:
    - contents: # No title/desc here: the page already shows an "API reference" heading from the top-level title above (issue #1330)
        - analyzers
        - arrays
        - conditions
        - connectors
        - data
        - dates
        - demographics
        - dimensions
        - diseases
        - distributions
        - fit
        - geo
        - internals.debugtools
        - internals.errors
        - internals.expressions
        - internals.gradients
        - internals.graph
        - internals.presentation
        - interventions
        - loop
        - modules
        - networks
        - parameters
        - people
        - products
        - results
        - run
        - settings
        - sim
        - strains
        - time
        - timeline
        - transitions
        - utils
        - kind: page
          path: io
          package: starsim
          contents:
            - kind: auto
              name: io
              include_imports: true
              children: embedded
    - title: Library
      desc: |
        Example and reference modules that build on core Starsim but are not part of it.
        Import as `import starsim.library as ssl`. These modules are illustrative rather
        than validated; see the [user guide](../user_guide/io_library.qmd) for details.
      contents:
        # One page per library subpackage; contents are picked up automatically from each
        # subpackage's __init__.py, so adding a class to the library does not need any
        # docs changes. include_imports is required since these are imported, not defined,
        # in the __init__.py that is being documented. Keep package as starsim (not
        # starsim.library): otherwise quartodoc reparses all of starsim for every alias.
        - kind: page
          path: library.diseases
          package: starsim
          contents:
            - kind: auto
              name: library.diseases
              include_imports: true
              children: embedded
        - kind: page
          path: library.mnch
          package: starsim
          contents:
            - kind: auto
              name: library.mnch
              include_imports: true
              children: embedded
        - kind: page
          path: library.networks
          package: starsim
          contents:
            - kind: auto
              name: library.networks
              include_imports: true
              children: embedded

format:
  html:
    theme: 
      light: [cosmo, ./assets/styles-light.scss]
      dark: [cosmo, ./assets/styles-dark.scss]
    css: ./assets/styles.css
    include-after-body: ./assets/collapse_sections.html
    toc: true
    toc-expand: true
    toc-depth: 5
    highlight-style: github

filters:
  - interlinks
  - assets/authorship.lua

interlinks:
  sources: {} # Only link to Starsim itself (objects.json); external inventories made every page slower to render
  autolink: true
  aliases:
    starsim: [null, ss]
    starsim.library: [ssl]

qpyd:
  prerender:
    commands: [python make_api.py] # The machine-readable API index (api.json, llms.txt, llms-full.txt)
    inputs: [make_api.py]
    outputs: [api.json, llms.txt, llms-full.txt]
  clean: # Temporary files the tutorials and user guide pages write
    - 'tutorials/**/my-*.*'
    - 'tutorials/**/example*.*'
    - 'user_guide/**/my-*.*'
    - 'user_guide/**/example*.*'
    - 'user_guide/results'

execute:
  freeze: auto # Only re-execute notebooks that have changed
  cache: true # NB, not sure if this is needed for Quarto notebooks
  error: false # Do not continue if an error is encountered
  echo: true
  warning: true
