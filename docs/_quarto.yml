project:
  type: website
  pre-render: qpyd prerender # API docs etc. (see the qpyd section below); skipped if Starsim and the config are unchanged
  post-render: qpyd clean # Remove the files the notebooks write (see qpyd.clean below)
  output-dir: _site
  title: "Starsim"
  execute-dir: file
  resources:
    - objects.json
    - objects.inv
    - llms.txt
    - llms-full.txt
    - api.json

