quartodoc:
  package: starsim
  title: API reference
  style: pkgdown
  dir: api
  parser: google
  render_interlinks: true
  sections:
    - contents: # No title/desc here: the page already shows an "API reference" heading from the top-level title above (issue #1330)
        - analyzers
        - arrays
        - conditions
        - connectors
        - data
        - dates
        - debugtools
        - demographics
        - dimensions
        - diseases
        - distributions
        - errors
        - expressions
        - fit
        - geo
        - gradients
        - graph
        - interventions
        - loop
        - modules
        - networks
        - parameters
        - people
        - pregnancy
        - presentation
        - products
        - results
        - run
        - settings
        - sim
        - spec
        - strains
        - time
        - timeline
        - transitions
        - utils
        - kind: page
          path: interop
          package: starsim
          contents:
            - kind: auto
              name: interop
              include_imports: true
              children: embedded
    - title: Library
      desc: |
        Example and reference modules that build on core Starsim but are not part of it.
        Import as `import starsim.library as ssl`. These modules are illustrative rather
        than validated; see the [user guide](../user_guide/modules_library.qmd) for details.
      contents:
        # One page per library subpackage; contents are picked up automatically from each
        # subpackage's __init__.py, so adding a class to the library does not need any
        # docs changes. include_imports is required since these are imported, not defined,
        # in the __init__.py that is being documented. Keep package as starsim (not
        # starsim.library): otherwise quartodoc reparses all of starsim for every alias.
        - kind: page
          path: library.diseases
          package: starsim
          contents:
            - kind: auto
              name: library.diseases
              include_imports: true
              children: embedded
        - kind: page
          path: library.mnch
          package: starsim
          contents:
            - kind: auto
              name: library.mnch
              include_imports: true
              children: embedded
        - kind: page
          path: library.networks
          package: starsim
          contents:
            - kind: auto
              name: library.networks
              include_imports: true
              children: embedded

format:
  html:
    theme: 
      light: [cosmo, ./assets/styles-light.scss]
      dark: [cosmo, ./assets/styles-dark.scss]
    css: ./assets/styles.css
    include-after-body: ./assets/collapse_sections.html
    toc: true
    toc-expand: true
    toc-depth: 5
    highlight-style: github

filters:
  - interlinks
  - assets/authorship.lua

interlinks:
  fast: false
  sources:
    python:
      url: https://docs.python.org/3/
    numpy:
      url: https://numpy.org/doc/stable/
    pandas:
      url: https://pandas.pydata.org/pandas-docs/stable/
    scipy:
      url: https://docs.scipy.org/doc/scipy/
    matplotlib:
      url: https://matplotlib.org/stable/
    sciris:
      url: https://docs.sciris.org/
  autolink: true
  aliases:
    numpy: [np]
    pandas: [pd]
    matplotlib: [plt]
    sciris: [sc]
    starsim: [null, ss]
    starsim.library: [ssl]

execute:
  freeze: auto # Only re-execute notebooks that have changed
  cache: true # NB, not sure if this is needed for Quarto notebooks
  error: false # Do not continue if an error is encountered
  echo: true
  warning: true
