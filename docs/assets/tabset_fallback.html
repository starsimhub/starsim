<script>
// Tabs in a group sync by title (Python, R, Explicit), and Quarto leaves a tabset blank if it has no tab of the title chosen (e.g. Explicit in a tabset of Python and R); show its first tab instead
function showFirstTabs() {
  for (const tabset of document.querySelectorAll('.panel-tabset[data-group]')) {
    const tabs = tabset.querySelectorAll(':scope > .nav-tabs > .nav-item > .nav-link');
    if (!tabs.length || tabset.querySelector(':scope > .nav-tabs .nav-link.active')) continue;
    tabs[0].classList.add('active');
    document.getElementById(tabs[0].getAttribute('aria-controls'))?.classList.add('active');
  }
}
window.addEventListener('pageshow', () => setTimeout(showFirstTabs, 0)); // After Quarto's own pageshow handler, which restores the saved tab (pageshow fires after load)
document.addEventListener('click', (event) => {
  if (event.target.closest('.panel-tabset[data-group] .nav-link')) setTimeout(showFirstTabs, 0); // After Quarto's own handler
});
</script>
