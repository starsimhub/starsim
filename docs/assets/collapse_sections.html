<script>
// The sidebar's sections: "Expand all" and "Collapse all", and which sections are open, and where the sidebar is scrolled, kept from page to page.
// Sections listed in `collapsed` start collapsed, unless the current page is in them (Quarto can only set this for all sections at once, via collapse-level)
document.addEventListener('DOMContentLoaded', () => {
  const sidebar = document.querySelector('#quarto-sidebar');
  const sections = sidebar ? [...sidebar.querySelectorAll('.sidebar-item-section')] : [];
  if (!sections.length) return;
  const collapsed = ['Architecture'];
  const title = (section) => section.querySelector(':scope > .sidebar-item-container .menu-text')?.textContent.trim() ?? '';
  const path = (section) => { // Its title and those of the sections it is in, so that the same title in two sidebars is not confused
    const titles = [];
    for (let s = section; s; s = s.parentElement.closest('.sidebar-item-section')) titles.unshift(title(s));
    return titles.join(' / ');
  };
  const key = 'starsim-sidebar:' + sections.map(title).join('|'); // One per sidebar (user guide, API, ...)
  const saved = JSON.parse(localStorage.getItem(key) || '{}');
  const setOpen = (section, open) => { // Without Bootstrap's animation
    section.querySelector(':scope > ul.collapse')?.classList.toggle('show', open);
    for (const toggle of section.querySelectorAll(':scope > .sidebar-item-container [data-bs-toggle="collapse"]')) {
      toggle.classList.toggle('collapsed', !open);
      toggle.setAttribute('aria-expanded', String(open));
    }
  };
  const isOpen = (section) => section.querySelector(':scope > ul.collapse')?.classList.contains('show') ?? false;
  const save = (all) => { // all: true or false after "Expand all" or "Collapse all", since the current page's section stays open on screen
    const state = {};
    for (const section of sections) state[path(section)] = typeof all === 'boolean' ? all : isOpen(section);
    localStorage.setItem(key, JSON.stringify(state));
  };

  // Open each section as it was left (or by default), always with the current page showing
  for (const section of sections) {
    const p = path(section);
    const open = section.querySelector('.sidebar-link.active') ? true : p in saved ? saved[p] : !collapsed.includes(title(section)) && isOpen(section);
    setOpen(section, open);
  }
  sidebar.addEventListener('shown.bs.collapse', () => save());
  sidebar.addEventListener('hidden.bs.collapse', () => save());

  // Expand all and collapse all
  const bar = document.createElement('div');
  bar.className = 'sidebar-expand-all';
  for (const [text, open] of [['Expand all', true], ['Collapse all', false]]) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = text;
    button.addEventListener('click', () => {
      for (const section of sections) setOpen(section, open || !!section.querySelector('.sidebar-link.active'));
      save(open);
    });
    bar.append(button);
  }
  sidebar.querySelector('.sidebar-menu-container')?.prepend(bar);

  // Where the sidebar was scrolled, if the current page is still in view there
  const scrollKey = key + ':scroll';
  const top = Number(sessionStorage.getItem(scrollKey));
  if (top) {
    sidebar.scrollTop = top;
    const active = sidebar.querySelector('.sidebar-link.active');
    if (active) {
      const a = active.getBoundingClientRect(), s = sidebar.getBoundingClientRect();
      if (a.top < s.top || a.bottom > s.bottom) active.scrollIntoView({block: 'center'});
    }
  }
  window.addEventListener('pagehide', () => sessionStorage.setItem(scrollKey, sidebar.scrollTop));
});
</script>
