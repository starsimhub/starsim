[build-system]
requires = ["setuptools", "setuptools-scm", "setuptools-rust>=1.12"] # setuptools-rust compiles the Rust kernels, if there is a toolchain (see [[tool.setuptools-rust.ext-modules]])
build-backend = "setuptools.build_meta"

[project]
name = "starsim"
dynamic = ["version"]
description = "A fast, flexible agent-based disease modeling framework"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["agent-based model", "simulation", "disease", "epidemiology"]

authors = [
  { name = "Starsim Development Team", email = "info@starsim.org" },
  { name = "Cliff Kerr" },
  { name = "Robyn Stuart" },
  { name = "Romesh Abeysuriya" },
  { name = "Paula Sanz-Leon" },
  { name = "Jamie Cohen" },
  { name = "Daniel Klein" }
]

classifiers = [
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Development Status :: 5 - Production/Stable",
]

dependencies = [
    "numpy>=2.0.0",
    "pandas>=3.0",
    "sciris>=3.7.0",
    "numba>=0.59.0",
    "scipy",
    "networkx",
    "matplotlib",
    "optuna",
    "starsim_data>=2.1.0",
]

[project.optional-dependencies]

# Gradients, fitting with them, and long runs in JAX: recommended, and optional only since JAX has no builds for some platforms (Intel Macs, Windows on ARM)
jax = [
    "jax>=0.8",
    "blackjax",
]

# For running the tests
test = [
    "pytest>=7.4",
    "pytest-cov",
    "pytest-env",
    "pytest-xdist",
    "pylint",
]

# For building the documentation
doc = [
    "quartopydoc", # Fork of quartodoc
    "sphobjinv",
    "jupyter",
    "jupyter-cache",
    "jupytext",
]

# Everything needed for development (tests + docs)
dev = [
    "starsim[jax,test,doc]",
]

# Accelerates numerical performance on some Intel systems
fastmath = [
  "mkl",
  "intel-cmplr-lib-rt"
]

# For exactly reproducible results (equivalent to uv.lock)
lock = [
    "absl-py==2.5.1",
    "alembic==1.20.1",
    "blackjax==1.7.1",
    "colorlog==6.12.0",
    "contourpy==1.4.0",
    "cycler==0.12.1",
    "dill==0.4.1",
    "et-xmlfile==2.0.0",
    "fonttools==4.68.0",
    "gitdb==4.0.12",
    "gitpython==3.2.1",
    "h5py==3.16.0",
    "jax==0.12.0.1",
    "jaxlib==0.12.0.1",
    "jellyfish==1.3.0",
    "jsonpickle==4.1.4",
    "kiwisolver==1.5.1",
    "line-profiler==5.1.0",
    "llvmlite==0.50.0",
    "mako==1.4.3",
    "markupsafe==3.0.4",
    "matplotlib==3.11.2",
    "memory-profiler==0.61.0",
    "ml-dtypes==0.6.0",
    "multiprocess==0.70.19",
    "networkx==3.7",
    "numba==0.68.1",
    "numpy==2.5.4",
    "openpyxl==3.1.5",
    "opt-einsum==3.4.0",
    "optax==0.2.8",
    "optuna==5.0.0",
    "packaging==26.3",
    "pandas==3.1.0",
    "pillow==13.0.0",
    "psutil==7.2.2",
    "pyparsing==3.3.3",
    "python-dateutil==3.0.0",
    "pyyaml==6.0.3",
    "scipy==1.18.1",
    "sciris==3.7.0",
    "setuptools==84.2.1",
    "six==1.17.0",
    "smmap==5.0.3",
    "sqlalchemy==2.1.6",
    "starsim-data==2.2.0",
    "tqdm==4.70.1",
    "typing-extensions==4.16.0",
    "tzdata==2026.6",
    "xlsxwriter==3.3.1",
    "zstandard==0.25.0",
]

optuna = ["scikit-learn"]

[project.scripts]
starsim = "starsim.internals.cli:main"

[project.urls]
"Website" = "https://starsim.org"
"Source" = "https://github.com/starsimhub/starsim/"

[tool.setuptools.packages.find]
where = ["."]
include = ["starsim*"]
exclude = ["starsim.solvers.rust*"] # The Rust kernels' source: compiled into wheels and shipped in the sdist (see MANIFEST.in), not installed

[tool.setuptools.exclude-package-data]
"starsim.solvers" = ["rust/*", "rust/**/*"]

[tool.setuptools.package-data]
starsim = ["*.ipynb", "*.rst", "*.csv"]
starsim_ai = ["**/*"]

[tool.setuptools.dynamic]
version = {attr = "starsim.version.__version__"}

# The Rust kernels, as one abi3 extension for Python 3.11 and later. Optional: where a wheel doesn't fit and there is no toolchain, pip installs from the sdist without them, and Numba's kernels run
[[tool.setuptools-rust.ext-modules]]
target = "starsim.solvers.backends._rs"
path = "starsim/solvers/rust/Cargo.toml"
binding = "PyO3"
optional = true
args = ["--locked"]

[tool.distutils.bdist_wheel]
py-limited-api = "cp311"

# One wheel per platform (see .github/workflows/pypi_release.yml): built on the oldest Python, which later ones load through abi3
[tool.cibuildwheel]
build = "cp311-*"
skip = "*-musllinux*"
archs = ["auto64"]
test-command = "python -c \"import starsim as ss; assert ss.solvers.backends.rust.on; print(ss.compile_status()); ss.Sim(diseases='sir', networks='random', n_agents=1000, stop=20, verbose=0).run()\""

[tool.cibuildwheel.linux]
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }
