# Install Quarto from sciris/quarto-cli, which renders in parallel (`--jobs`), and the faster interlinks filter from
# sciris/quartopydoc. The fork has no releases, so it is built from source once for each commit, then restored from the cache.

name: Install Quarto
description: Install Sciris's Quarto for building the docs
inputs:
  ref:
    description: The commit of sciris/quarto-cli
    default: 62b0d757c153ab0b938b5dedc81fbdf07d18d9dc
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      id: cache
      with:
        path: quarto-cli
        key: quarto-${{ runner.os }}-${{ inputs.ref }}
    - name: Check out Quarto
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/checkout@v7
      with:
        repository: sciris/quarto-cli
        ref: ${{ inputs.ref }}
        path: quarto-cli
    - name: Build Quarto
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: quarto-cli
      run: ./configure.sh
    - name: Put Quarto on the path
      shell: bash
      run: echo "$PWD/quarto-cli/package/dist/bin" >> "$GITHUB_PATH"
    - name: Install the interlinks filter
      shell: bash
      working-directory: docs
      run: quarto add sciris/quartopydoc --no-prompt
