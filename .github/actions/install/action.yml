# Install Starsim with kernels that are known to be fresh, for a job to test: used by the workflows in this
# folder's parent, after checking out Starsim and setting up Python.
#
# The Rust kernels are built once for each version of their source, then restored from the cache, since
# nothing else in a job compiles them (CARGO=false makes the install skip it: they are optional there). If the job
# has them already (as tests.yml's jobs do, from its job that builds them once), neither is needed.
# Afterwards STARSIM_KERNELS=rust, so that any import of Starsim is an error if the kernels are missing or
# were built from other source than is here, rather than falling back to Numba's.
#
# With `numba`, Numba's compiled kernels are restored too. The key is every file that mentions Numba, and
# Numba checks each cached function against the contents of its files (see starsim/solvers/backends/cache.py),
# so a cache is only used for the code it came from. A change to any of those files gives a new key, so the latest
# cache for the same Python and Numba is restored instead, and only what changed recompiles; the job saves its
# cache at the end even if it fails or times out, so that a slow run makes the next one faster. Scheduled runs always compile, as a check on this. The CPU
# is generic so that a cache can be used on any of GitHub's runners, which have several kinds.

name: Install Starsim
description: Install Starsim with fresh kernels
inputs:
  extras:
    description: The extras to install, e.g. "[dev]"
    default: ''
  rust:
    description: Whether the job needs the Rust kernels
    default: 'true'
  numba:
    description: Whether the job runs Numba's kernels, so should restore them
    default: 'false'
outputs:
  numba-key:
    description: The key to save Numba's cache under at the end of the job (with actions/cache/save, if always())
    value: numba-${{ runner.os }}-${{ steps.numba.outputs.key }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
      with:
        version: 0.13.0
    - id: built
      if: inputs.rust == 'true'
      shell: bash
      run: test -f starsim/solvers/backends/_rs.abi3.so && echo "found=true" >> "$GITHUB_OUTPUT" || true # Built by an earlier job and downloaded
    - id: rust
      if: inputs.rust == 'true' && steps.built.outputs.found != 'true'
      uses: actions/cache@v4
      with:
        path: starsim/solvers/backends/_rs.abi3.so
        key: kernels-${{ runner.os }}-${{ hashFiles('starsim/solvers/rust/**') }}
    - name: Build the Rust kernels
      if: inputs.rust == 'true' && steps.built.outputs.found != 'true' && steps.rust.outputs.cache-hit != 'true'
      shell: bash
      working-directory: starsim/solvers/rust
      run: ./build # Rust is installed on GitHub's runners
    - name: Install Starsim
      shell: bash
      run: |
        echo "UV_SYSTEM_PYTHON=1" >> "$GITHUB_ENV"
        echo "CARGO=false" >> "$GITHUB_ENV"
        UV_SYSTEM_PYTHON=1 CARGO=false uv pip install -e ".${{ inputs.extras }}"
    - name: Require the Rust kernels
      if: inputs.rust == 'true'
      shell: bash
      run: |
        echo "STARSIM_KERNELS=rust" >> "$GITHUB_ENV"
        STARSIM_KERNELS=rust python -c "import starsim as ss; assert ss.solvers.backends.rust.on; print(ss.kernels.compile_status().summary)"
    - name: Find Numba's cache
      id: numba
      if: inputs.numba == 'true'
      shell: bash
      run: |
        echo "NUMBA_CACHE_DIR=$HOME/.numba" >> "$GITHUB_ENV"
        echo "NUMBA_CPU_NAME=generic" >> "$GITHUB_ENV"
        prefix=$(python -c 'import sys, numba; print(f"py{sys.version_info.minor}-{numba.__version__}-")')
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=$prefix$(git grep -lE 'numba|nb\.|ss\.jit' -- 'starsim/*.py' | sort | xargs sha256sum | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - if: inputs.numba == 'true' && github.event_name != 'schedule'
      uses: actions/cache/restore@v4
      with:
        path: ~/.numba
        key: numba-${{ runner.os }}-${{ steps.numba.outputs.key }}
        restore-keys: numba-${{ runner.os }}-${{ steps.numba.outputs.prefix }}
