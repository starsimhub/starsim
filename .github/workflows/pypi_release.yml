name: Publish Starsim to PyPI

# For a version tag: builds and tests everything (build_wheels.yml), and publishes it if all of that passes. This is the only workflow that publishes.
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    uses: ./.github/workflows/build_wheels.yml

  publish-to-pypi:
    name: Publish Starsim
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/starsim
    permissions:
      id-token: write

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        pattern: dist-*
        merge-multiple: true
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
