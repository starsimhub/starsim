# Note: this test only runs manually or on pushes to
# tagged versions.

name: Publish docs

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # Not pre-releases, which aren't what pip installs, so leave the docs alone
  workflow_dispatch:

jobs:
  publish:
    name: Quarto
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - uses: ./.github/actions/install
      with:
        extras: '[dev]'

    - uses: ./.github/actions/quarto

    - name: Custom Quarto publish
      working-directory: ./docs
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@users.noreply.github.com"
        ./publish

