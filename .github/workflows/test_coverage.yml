name: Coverage
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency: # A newer push to a pull request replaces its older runs, which would only queue ahead of it
  group: coverage-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    name: Test coverage
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: actions/setup-python@master
        with:
          python-version: '3.13'
          architecture: x64
      - uses: ./.github/actions/install
        with:
          extras: '[dev]'
          numba: true
      - name: Run tests with coverage
        working-directory: ./tests
        run: pytest test_*.py -n logical --cov-config=.coveragerc --cov=../starsim --durations=0
      - name: Print coverage report
        working-directory: ./tests
        run: coverage report
