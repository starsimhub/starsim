# Test that docs build successfully. Disabled for now: run it manually from the
# Actions tab. To re-enable, restore the push and pull_request triggers below.

name: Test docs

on:
  # push:
  #   branches:
  #     - main
  # pull_request:
  #   branches:
  #     - main
  workflow_dispatch:

jobs:
  test:
    name: Render
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - uses: ./.github/actions/install
      with:
        extras: '[dev]'

    - name: Set up Quarto
      uses: quarto-dev/quarto-actions/setup@v2

    - name: Install Quarto interlinks
      working-directory: ./docs
      run: quarto add sciris/quartopydoc --no-prompt # Fork with a faster interlinks filter

    - name: Render docs
      working-directory: ./docs
      run: ./render
