name: Benchmarks
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency: # A newer push to a pull request replaces its older runs, which would only queue ahead of it
  group: benchmarks-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    name: Quick benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: actions/setup-python@master
        with:
          python-version: '3.13'
          architecture: x64
      - uses: ./.github/actions/install
        with:
          extras: '[dev]'
      - name: Run quick benchmark
        working-directory: ./tests
        run: ./quick_benchmark
