name: Linting
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency: # A newer push to a pull request replaces its older runs, which would only queue ahead of it
  group: linting-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Pylint
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: actions/setup-python@master
        with:
          python-version: '3.13'
          architecture: x64
      - uses: ./.github/actions/install
        with:
          extras: '[dev]'
          rust: false
      - name: Run pylint
        run: pylint starsim --rcfile=.pylintrc --fail-under=9
