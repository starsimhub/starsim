name: Starsim CI
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency: # A newer push to a pull request replaces its older runs, which would only queue ahead of it
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Build the Rust kernels
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: actions/setup-python@master
        with:
          python-version: '3.12' # The kernels are built for Python's stable ABI from 3.12, so one build serves every version
          architecture: x64
      - uses: ./.github/actions/install # Restores them from the cache, or builds them, and checks that they load
      - uses: actions/upload-artifact@v4
        with:
          name: rust-kernels
          path: starsim/solvers/backends/_rs.abi3.so
          retention-days: 1

  install_and_test:
    name: Tests
    needs: rust
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        os: ['ubuntu-latest']
        python-version: ['3.12', '3.14']
        kernels: ['rust', 'numba'] # Rust's run every test but those marked numba; Numba's run only those (test_kernel_sets.py compares them, bit for bit), so only they compile Numba
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: actions/setup-python@master
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - uses: actions/download-artifact@v4
        with:
          name: rust-kernels
          path: starsim/solvers/backends
      - id: install
        uses: ./.github/actions/install
        with:
          extras: '[dev]'
          numba: ${{ matrix.kernels == 'numba' }}
      - name: Run API tests
        working-directory: ./tests
        env:
          STARSIM_KERNELS: ${{ matrix.kernels }}
          STARSIM_RUST_REQUIRED: 1 # So the comparison with Rust's kernels fails rather than skips if they weren't built
          MARKER: ${{ matrix.kernels == 'numba' && 'numba and not slow' || 'not numba and not slow' }} # Replaces pytest.ini's "not slow", so repeats it
        run: pytest test_*.py -m "$MARKER" -n logical --durations=0 --junitxml=test-results.xml # Run actual tests; logical since auto counts physical cores, 2 on GitHub's runners
      - name: Save Numba's cache # Even after a failure or timeout, so the next run compiles less
        if: always() && matrix.kernels == 'numba' && github.event_name != 'schedule'
        uses: actions/cache/save@v4
        with:
          path: ~/.numba
          key: ${{ steps.install.outputs.numba-key }}
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: './tests/test-results.xml'
          check_name: 'Test Report (Python ${{ matrix.python-version }}, ${{ matrix.kernels }})'
