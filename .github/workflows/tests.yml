name: Starsim CI
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  install_and_test:
    name: Tests
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        os: ['ubuntu-latest']
        python-version: ['3.11', '3.14']
        kernels: ['rust', 'numba'] # The suite with each (both are built, so test_kernel_sets.py compares them either way)
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: actions/setup-python@master
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Install Starsim
        run: pip install -e .[dev]
      - name: Build the Rust kernels
        working-directory: ./rust
        run: ./build # Rust is installed on GitHub's runners
      - name: Run API tests
        working-directory: ./tests
        env:
          STARSIM_KERNELS: ${{ matrix.kernels }}
          STARSIM_RUST_REQUIRED: 1 # So the comparison with Rust's kernels fails rather than skips if they weren't built
        run: pytest test_*.py -n auto --durations=0 --junitxml=test-results.xml # Run actual tests
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: './tests/test-results.xml'
          check_name: 'Test Report (Python ${{ matrix.python-version }}, ${{ matrix.kernels }})'
