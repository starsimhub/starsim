# Run downstream tests on Starsim models.
#
# Note: this test runs on pushes/merges to main and on PRs targeting main or v4.
# Pushes to v4 are tested through its PR into main.
#
# For now, each package's v4 branch is tested (it is an error if a package
# has no v4 branch); set `ref` back to main once Starsim 4 is released.
#
# Current supported models are:
#   1. STIsim
#   2. FPsim
#   3. HPVsim
#   4. TBsim
#   5. malariasim
#   6. Covasim
#   7. MIGHTI
#   8. Typhoidsim
#
# R-Starsim is tested in test_r.yml, since it needs R.
#
# TBC:
# - Rotasim (still in beta)

name: Downstream
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - v4

jobs:

  test_downstream:
    name: ${{ matrix.model }} tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {model: STIsim,     repo: starsimhub/stisim,          ref: v4, dir: stisim,     install: pip install -e . -r tests/requirements.txt}
          - {model: HPVsim,     repo: starsimhub/hpvsim,          ref: v4, dir: hpvsim,     install: 'pip install -e ".[hiv]" -r tests/requirements.txt git+https://github.com/starsimhub/stisim@v4 && hpvsim-download-data'} # [hiv] pulls in stisim, which the HIV tests need, from its v4 branch rather than the release
          - {model: TBsim,      repo: starsimhub/tbsim,           ref: v4, dir: tbsim,      install: pip install -e . -r tests/requirements.txt}
          - {model: FPsim,      repo: starsimhub/fpsim,           ref: v4, dir: fpsim,      install: pip install -e . -r tests/requirements.txt}
          - {model: malariasim, repo: starsimhub/starsim-malaria, ref: v4, dir: malariasim, install: 'pip install -e ".[dev]" pytest-xdist'}
          - {model: Covasim,    repo: starsimhub/covasim,         ref: v4, dir: covasim,    install: 'pip install -e ".[test]"'}
          - {model: MIGHTI,     repo: starsimhub/mighti,          ref: v4, dir: mighti,     install: 'pip install -e ".[dev]" pytest-xdist git+https://github.com/starsimhub/stisim@v4'} # As for HPVsim, get stisim from its v4 branch rather than the release
          - {model: Typhoidsim, repo: starsimhub/typhoidsim,      ref: v4, dir: typhoidsim, install: pip install -e . -r tests/requirements.txt}

    steps:
      - name: Checkout Starsim
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Starsim
        run: pip install -e .

      - name: Check out ${{ matrix.model }} (${{ matrix.ref }})
        uses: actions/checkout@v7 # Fails if the branch doesn't exist
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: ${{ matrix.dir }}

      - name: Install ${{ matrix.model }}
        working-directory: ./${{ matrix.dir }}
        run: ${{ matrix.install }}

      - name: Reinstall Starsim # In case the package's requirements pulled in a released Starsim
        run: pip install --no-deps -e .

      - name: Run ${{ matrix.model }} tests
        working-directory: ./${{ matrix.dir }}/tests
        env:
          SCIRIS_BACKEND: agg
          STARSIM_SHOW: 0
        run: pytest test_*.py -n auto --durations=0 --junitxml=results.xml
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test_results-${{ matrix.dir }}
          path: ${{ matrix.dir }}/tests/results.xml
