# Run downstream tests on Starsim models.
#
# Note: this test runs on pushes/merges to main and on PRs targeting main or v4.
# Pushes to v4 are tested through its PR into main.
#
# For now, each package's v4 branch is tested (it is an error if a package
# has no v4 branch); set `ref` back to main once Starsim 4 is released.
#
# Current supported models are:
#   1. STIsim
#   2. FPsim
#   3. HPVsim
#   4. TBsim
#   5. malariasim
#   6. Covasim
#   7. MIGHTI
#   8. Typhoidsim
#   9. Rotasim
#
# The other frameworks are tested in frameworks.yml, in the lingua_franca_design repo: one job for
# each, which builds it if its recipe has changed, and runs the import and export tests and the benchmark.
#
# R-Starsim is tested in test_r.yml, since it needs R.

name: Downstream
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - v4

concurrency: # A newer push to a pull request replaces its older runs, which would only queue ahead of it
  group: downstream-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  frameworks:
    uses: starsimhub/lingua_franca_design/.github/workflows/frameworks.yml@main
    with:
      starsim_repo: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      starsim_ref: ${{ github.sha }}

  test_downstream:
    name: ${{ matrix.model }} tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {model: STIsim,     repo: starsimhub/stisim,          ref: v4, dir: stisim,     install: uv pip install -e . -r tests/requirements.txt}
          - {model: HPVsim,     repo: starsimhub/hpvsim,          ref: v4, dir: hpvsim,     install: 'uv pip install -e ".[hiv]" -r tests/requirements.txt git+https://github.com/starsimhub/stisim@v4 && hpvsim-download-data'} # [hiv] pulls in stisim, which the HIV tests need, from its v4 branch rather than the release
          - {model: TBsim,      repo: starsimhub/tbsim,           ref: v4, dir: tbsim,      install: uv pip install -e . -r tests/requirements.txt}
          - {model: FPsim,      repo: starsimhub/fpsim,           ref: v4, dir: fpsim,      install: uv pip install -e . -r tests/requirements.txt}
          - {model: malariasim, repo: starsimhub/starsim-malaria, ref: v4, dir: malariasim, install: 'uv pip install -e ".[dev]" pytest-xdist'}
          - {model: Covasim,    repo: starsimhub/covasim,         ref: v4, dir: covasim,    install: 'uv pip install -e ".[test]"'}
          - {model: MIGHTI,     repo: starsimhub/mighti,          ref: v4, dir: mighti,     install: 'uv pip install -e ".[dev]" pytest-xdist git+https://github.com/starsimhub/stisim@v4'} # As for HPVsim, get stisim from its v4 branch rather than the release
          - {model: Typhoidsim, repo: starsimhub/typhoidsim,      ref: v4, dir: typhoidsim, install: uv pip install -e . -r tests/requirements.txt}
          - {model: Rotasim,    repo: starsimhub/rotasim,         ref: v4, dir: rotasim,    install: uv pip install -e . -r tests/requirements.txt}

    steps:
      - name: Checkout Starsim
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - uses: ./.github/actions/install

      - name: Check out ${{ matrix.model }} (${{ matrix.ref }})
        uses: actions/checkout@v7 # Fails if the branch doesn't exist
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: ${{ matrix.dir }}

      - name: Install ${{ matrix.model }}
        working-directory: ./${{ matrix.dir }}
        run: ${{ matrix.install }}

      - name: Reinstall Starsim # In case the package's requirements pulled in a released Starsim
        run: uv pip install --no-deps -e .

      - name: Run ${{ matrix.model }} tests
        working-directory: ./${{ matrix.dir }}/tests
        env:
          SCIRIS_BACKEND: agg
          STARSIM_SHOW: 0
        run: pytest test_*.py -n logical --durations=0 --junitxml=results.xml
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test_results-${{ matrix.dir }}
          path: ${{ matrix.dir }}/tests/results.xml
