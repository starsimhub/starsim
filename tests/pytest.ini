[pytest]
# importlib lets devtests/ reuse the names of the files in tests/ (devtests/test_networks.py has the rest of the network tests)
# The tests marked slow are skipped unless asked for, with -m slow (or -m "" for every test)
addopts = --import-mode=importlib -m "not slow"
markers =
    slow: a longer run, skipped unless asked for with -m slow
    numba: compiles Numba's kernels (most tests use Rust's when built); CI runs these with Numba's and the rest with Rust's, so only these compile Numba
filterwarnings =
    ignore::pytest.PytestReturnNotNoneWarning
env =
    SCIRIS_BACKEND=agg
    STARSIM_UNCOMPILED_WARNING=0
    STARSIM_SKILL_NOTE=0
